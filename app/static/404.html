<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#111111">
  <title>Página não encontrada | M4 Tática</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f5f5; color: #202124; }
    main { width: min(100%, 620px); padding: 36px 28px; border: 1px solid #e1e1e1; border-top: 5px solid #c5a059; border-radius: 12px; background: #fff; text-align: center; box-shadow: 0 12px 36px rgba(0,0,0,.08); }
    .code { margin: 0; color: #8b6d31; font-size: clamp(3.5rem, 14vw, 6rem); font-weight: 900; line-height: 1; }
    h1 { margin: 18px 0 10px; font-size: clamp(1.5rem, 5vw, 2rem); }
    p { margin: 0 auto 24px; max-width: 44ch; color: #5f6368; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .actions form { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .actions input { min-height: 46px; width: min(100%, 230px); padding: 10px 12px; border: 1px solid #aeb4b9; border-radius: 6px; font: inherit; }
    a, button { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 11px 18px; border: 1px solid #111; border-radius: 6px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    .primary { background: #111; color: #fff; }
    .secondary { background: #fff; color: #111; }
    a:focus-visible, button:focus-visible { outline: 3px solid #c5a059; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Não encontramos esta página</h1>
    <p>O endereço pode ter mudado ou o link pode estar incorreto. Volte à loja ou pesquise o produto que procura.</p>
    <div class="actions">
      <a class="primary" href="https://loja.m4tatica.com.br/">Voltar à loja</a>
      <form action="https://loja.m4tatica.com.br/" method="get">
        <label for="busca-404" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Pesquisar produtos</label>
        <input id="busca-404" type="search" name="q" placeholder="Buscar produtos" required>
        <button class="secondary" type="submit">Pesquisar</button>
      </form>
    </div>
  </main>
</body>
</html>
